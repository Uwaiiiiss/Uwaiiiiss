<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Uwais — ideas in orbit</title>
  <desc id="desc">A dark space interface with a glowing planet, orbit rings, and the words UWAIS and ideas in orbit.</desc>
  <defs>
    <radialGradient id="bg" cx="76%" cy="48%" r="76%">
      <stop offset="0" stop-color="#171a3b"/>
      <stop offset=".48" stop-color="#090d1e"/>
      <stop offset="1" stop-color="#04050b"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#423a8f"/>
      <stop offset=".34" stop-color="#181d4d"/>
      <stop offset=".8" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop stop-color="#7b61ff" stop-opacity=".15"/>
      <stop offset=".48" stop-color="#9f8cff"/>
      <stop offset="1" stop-color="#b7ff58"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" x2="1"><stop stop-color="#9bff4b"/><stop offset="1" stop-color="#e7ff9a"/></linearGradient>
    <pattern id="scan" width="5" height="7" patternUnits="userSpaceOnUse"><path d="M0 6H5" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="disc"><circle cx="850" cy="260" r="174"/></clipPath>
    <path id="satPath" d="M565 260a285 95 0 1 0 570 0a285 95 0 1 0-570 0"/>
    <style>
      .pulse { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; }
      .orbit { animation: orbit 16s linear infinite; transform-origin: 850px 260px; }
      .orbit2 { animation: orbit 24s linear infinite reverse; transform-origin: 850px 260px; }
      .drift { animation: drift 9s ease-in-out infinite; }
      .flicker { animation: flicker 5s steps(2,end) infinite; }
      @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.85)} 50%{opacity:1;transform:scale(1.15)} }
      @keyframes orbit { to { transform: rotate(360deg) } }
      @keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
      @keyframes flicker { 0%,91%,100%{opacity:.7} 93%{opacity:.15} 95%{opacity:.85} }
      @media (prefers-reduced-motion: reduce) { .pulse,.orbit,.orbit2,.drift,.flicker{animation:none} }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#scan)"/>

  <g fill="#dce2ff">
    <circle cx="94" cy="84" r="1.5"/><circle cx="330" cy="56" r="1"/><circle cx="448" cy="390" r="1.4"/>
    <circle cx="560" cy="102" r="1"/><circle cx="1090" cy="82" r="1.6"/><circle cx="1145" cy="426" r="1"/>
    <circle cx="1020" cy="160" r=".9"/><circle cx="702" cy="442" r="1.1"/><circle cx="205" cy="438" r="1.3"/>
  </g>
  <g fill="#b8ff58" class="pulse"><circle cx="184" cy="144" r="2"/><circle cx="1085" cy="346" r="2"/></g>

  <g transform="translate(74 78)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text fill="#aab0cc" font-size="12" letter-spacing="4">UWAIS / PERSONAL SYSTEM</text>
    <text y="112" fill="#f3f5ff" font-size="76" font-weight="700" letter-spacing="8">UWAIS</text>
    <text y="151" fill="url(#lime)" font-size="18" letter-spacing="5">IDEAS IN ORBIT</text>
    <path d="M0 188h280" stroke="#6e62d4"/>
    <text y="220" fill="#8d92b2" font-size="13">build / cut / draw / repeat</text>
    <text y="260" fill="#555b7d" font-size="11" letter-spacing="2">STATUS: MAKING SOMETHING</text>
  </g>

  <g opacity=".5" stroke="#5e5a9e" fill="none">
    <circle cx="850" cy="260" r="208" stroke-dasharray="2 9"/>
    <circle cx="850" cy="260" r="235" stroke-dasharray="1 14"/>
    <path d="M570 260h560M850 28v464" stroke-dasharray="2 8"/>
  </g>

  <ellipse cx="850" cy="260" rx="285" ry="95" fill="none" stroke="url(#ring)" stroke-width="14" opacity=".22" filter="url(#blur)"/>
  <g class="orbit" fill="none">
    <ellipse cx="850" cy="260" rx="285" ry="95" stroke="url(#ring)" stroke-width="2"/>
    <ellipse cx="850" cy="260" rx="253" ry="73" stroke="#6e65d2" stroke-opacity=".7" stroke-dasharray="2 8"/>
  </g>
  <g class="orbit2" fill="none">
    <ellipse cx="850" cy="260" rx="315" ry="112" stroke="#a6ff52" stroke-width="1.5" stroke-dasharray="1 12" opacity=".8"/>
  </g>

  <circle cx="850" cy="260" r="174" fill="#7f6cff" opacity=".22" filter="url(#blur)"/>
  <circle cx="850" cy="260" r="174" fill="url(#planet)" stroke="#8779ff" stroke-width="2"/>
  <g clip-path="url(#disc)" fill="none" stroke-linecap="round">
    <path d="M690 192c86-45 173-50 282-8M681 245c96-38 218-31 337 19M694 316c112-34 221-20 308 22" stroke="#6d63d6" stroke-opacity=".45" stroke-width="13"/>
    <path d="M727 120l12 275M798 90l-8 360M900 88l12 345M988 125l-19 300" stroke="#a7ff5d" stroke-opacity=".18" stroke-width="2" stroke-dasharray="2 8"/>
    <path d="M700 365c56-44 100-35 140 0s82 42 154-6" stroke="#a9ff55" stroke-opacity=".72" stroke-width="3"/>
  </g>

  <g class="drift" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="1010" y="100" fill="#7d83a6">01 / EXPERIMENT</text>
    <text x="1010" y="118" fill="#b8ff58">signal detected</text>
    <text x="600" y="414" fill="#777da1">orbit locked</text>
  </g>

  <g class="flicker" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="74" y="466" fill="#4e5478" font-size="11" letter-spacing="2">AI EXPERIMENTS · VIBE-CODED APPS · VIDEO · DESIGN · GAMES</text>
  </g>

  <g class="orbit">
    <circle cx="565" cy="260" r="5" fill="#caff78"/>
    <circle cx="565" cy="260" r="12" fill="#caff78" opacity=".35" filter="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="518" rx="24" fill="none" stroke="#30355d"/>
</svg>
