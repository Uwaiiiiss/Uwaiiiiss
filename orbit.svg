<linearGradient id="rim"><stop stop-color="#5547f0"/><stop offset=".62" stop-color="#534eb0"/><stop offset="1" stop-color="#c3ff43"/></linearGradient>
<pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse"><path d="M0 5H4" stroke="#030511" stroke-opacity=".22"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><clipPath id="disk"><circle r="279"/></clipPath>
