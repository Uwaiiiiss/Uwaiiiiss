<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="704" viewBox="0 0 2048 704" role="img" aria-labelledby="title desc">
<title id="title">Uwais — ASCII orbit</title><desc id="desc">A ringed planet made of ASCII characters with a lime crescent, violet shadows and digital interference.</desc>
<defs>
<style>
  .starlight { animation: twinkle 6s ease-in-out infinite; }
  .rimlight { animation: breathe 8s ease-in-out infinite; }
  .ring-flow { animation: flow 12s linear infinite; }
  .interference { animation: drift 7s steps(1,end) infinite; }
  .beacon { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .42 } 50% { opacity: 1 } }
  @keyframes breathe { 0%,100% { opacity: .44 } 50% { opacity: .95 } }
  @keyframes flow { to { stroke-dashoffset: -105 } }
  @keyframes drift { 0%,100% { transform: translateX(0); opacity: .45 } 31% { transform: translateX(13px); opacity: .62 } 68% { transform: translateX(-21px); opacity: .8 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .satellite { display: none; } }
</style>
