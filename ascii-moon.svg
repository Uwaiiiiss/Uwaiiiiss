  <title id="title">Uwais — ASCII crescent</title>
  <desc id="desc">A monochrome terminal-style ASCII crescent moon with stars and clouds.</desc>
  <rect width="960" height="520" fill="#000"/>
  <style>
    .ascii { font-family: "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #f4f4f4; }
    .soft { opacity: .78; animation: flicker 7s steps(2,end) infinite; }
    .moon { animation: breathe 6s ease-in-out infinite; transform-origin: 69% 50%; }
    @keyframes breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
    @keyframes flicker { 0%,91%,100% { opacity: .72; } 93% { opacity: .28; } 95% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .soft,.moon { animation: none; } }
