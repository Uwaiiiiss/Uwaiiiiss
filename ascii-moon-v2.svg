<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Uwais — ASCII crescent</title>
  <desc id="desc">A sparse monochrome terminal-style ASCII crescent moon with stars and clouds.</desc>
  <rect width="920" height="520" fill="#000"/>
  <style>
    .ascii { font-family: "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 2px; fill: #f4f4f4; }
    .moon { animation: breathe 7s ease-in-out infinite; transform-origin: 50% 50%; }
    .soft { opacity: .7; animation: flicker 8s steps(2,end) infinite; }
    @keyframes breathe { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
    @keyframes flicker { 0%,91%,100% { opacity: .7; } 93% { opacity: .2; } 95% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .moon,.soft { animation: none; } }
  </style>
